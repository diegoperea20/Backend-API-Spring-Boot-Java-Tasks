spring.application.name=backendapi
server.port=8080
server.forward-headers-strategy=framework
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force-response=true

# El archivo .env de la raiz se carga con DotenvEnvironmentPostProcessor
# (soporta comillas, comentarios y export; las variables de entorno tienen prioridad)

# ==================== Aplicacion ====================
app.frontend-url=${FRONTEND_URL}
app.cors.origins=${CORS_ORIGINS}
app.jwt.secret=${JWT_SECRET_KEY}
app.jwt.expiration-minutes=${ACCESS_TOKEN_EXPIRE_MINUTES:60}
app.auth-code.ttl-minutes=5

# ==================== Rate limiting (equivalente a slowapi) ====================
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.register-per-minute=5
app.rate-limit.login-per-minute=10
app.rate-limit.exchange-per-minute=10
app.rate-limit.task-write-per-minute=20
app.rate-limit.delete-all-per-minute=5
app.rate-limit.max-buckets=100000

# ==================== Google OAuth ====================
app.google.client-id=${GOOGLE_CLIENT_ID}
app.google.client-secret=${GOOGLE_CLIENT_SECRET}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/authorize/google}

# ==================== Base de datos SQLite ====================
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==================== Migraciones ====================
# baseline-on-migrate permite reutilizar un app.db creado por el backend FastAPI
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ==================== JSON / OpenAPI / Logs ====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.root=INFO
logging.level.com.backend.backendapi=INFO
