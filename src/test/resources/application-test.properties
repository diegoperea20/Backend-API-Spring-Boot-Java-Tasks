spring.datasource.url=jdbc:h2:mem:backendapi;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

app.rate-limit.enabled=false
app.jwt.secret=test-secret-key-for-integration-tests-32-bytes
app.google.client-id=
app.google.client-secret=
app.google.redirect-uri=http://localhost:8000/authorize/google

logging.level.root=WARN
logging.level.com.backend.backendapi=INFO
